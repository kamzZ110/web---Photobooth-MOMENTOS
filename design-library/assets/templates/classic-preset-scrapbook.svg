<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#D5C7B8" />
    </pattern>
    <filter id="cardShadow" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#281e1a" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Warm Linen Scrapbook Page -->
  <rect width="900" height="1200" rx="28" fill="#FAF3EA" />
  <rect x="20" y="20" width="860" height="1160" rx="22" fill="url(#dotGrid)" stroke="#E4D7C5" stroke-width="2" />

  <!-- Editorial Header -->
  <text x="450" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-style="italic" fill="#2A1F1D">Little Moments Scrapbook</text>
  <text x="450" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" letter-spacing="3.5" fill="#BC4374">MOMENTOS JOURNAL EDITION • ISSUE 03</text>

  <!-- Polaroid 1 (Tilted Left) -->
  <g transform="translate(88, 196) rotate(-3.5)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="330" height="390" rx="8" fill="#FFFFFF" stroke="#E8E1D5" stroke-width="2" />
    <rect x="20" y="20" width="290" height="290" rx="4" fill="#F2E7DA" />
    <text x="165" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#8C735B">POLAROID 01</text>
    <text x="165" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#4A3F3A">candid warmth</text>
    <!-- Washi Tape Top -->
    <rect x="108" y="-14" width="114" height="30" rx="2" fill="#E89CB6" opacity="0.82" transform="rotate(2)" />
  </g>

  <!-- Polaroid 2 (Tilted Right) -->
  <g transform="translate(474, 218) rotate(3.2)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="330" height="390" rx="8" fill="#FFFFFF" stroke="#E8E1D5" stroke-width="2" />
    <rect x="20" y="20" width="290" height="290" rx="4" fill="#E9EFE4" />
    <text x="165" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#637054">POLAROID 02</text>
    <text x="165" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#4A3F3A">shared laugh</text>
    <!-- Washi Tape Top -->
    <rect x="110" y="-14" width="110" height="30" rx="2" fill="#A9C096" opacity="0.82" transform="rotate(-3)" />
  </g>

  <!-- Polaroid 3 (Bottom Center-Left) -->
  <g transform="translate(116, 650) rotate(2.1)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="330" height="390" rx="8" fill="#FFFFFF" stroke="#E8E1D5" stroke-width="2" />
    <rect x="20" y="20" width="290" height="290" rx="4" fill="#EFE8F4" />
    <text x="165" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#766384">POLAROID 03</text>
    <text x="165" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#4A3F3A">golden hour</text>
    <rect x="108" y="-14" width="114" height="30" rx="2" fill="#DFBE8E" opacity="0.82" />
  </g>

  <!-- Postmark / Annotation Card Bottom Right -->
  <g transform="translate(495, 690) rotate(-2)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="305" height="330" rx="14" fill="#FFFDF9" stroke="#D9CBB8" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="225" cy="74" r="44" fill="none" stroke="#BC4374" stroke-width="2.5" stroke-dasharray="4 3" />
    <text x="225" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#BC4374">APPROVED</text>
    <text x="34" y="160" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#2A1F1D">Notes from today:</text>
    <line x1="34" y1="204" x2="270" y2="204" stroke="#E0D3C2" stroke-width="1.5" />
    <line x1="34" y1="244" x2="270" y2="244" stroke="#E0D3C2" stroke-width="1.5" />
    <line x1="34" y1="284" x2="270" y2="284" stroke="#E0D3C2" stroke-width="1.5" />
  </g>
</svg>
