<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1600" width="600" height="1600">
  <defs>
    <filter id="paperShadow" x="-5%" y="-2%" width="110%" height="106%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2c1d18" flood-opacity="0.12" />
    </filter>
    <mask id="ticketNotches">
      <rect width="600" height="1600" fill="#ffffff" />
      <!-- Top & bottom half-circle punchouts -->
      <circle cx="0" cy="0" r="24" fill="#000000" />
      <circle cx="600" cy="0" r="24" fill="#000000" />
      <circle cx="0" cy="1600" r="24" fill="#000000" />
      <circle cx="600" cy="1600" r="24" fill="#000000" />
      <!-- Side perforation punchouts at divider line -->
      <circle cx="0" cy="1330" r="26" fill="#000000" />
      <circle cx="600" cy="1330" r="26" fill="#000000" />
    </mask>
  </defs>

  <!-- Outer Vintage Cream Ticket Base -->
  <g filter="url(#paperShadow)">
    <rect x="24" y="24" width="552" height="1552" rx="18" fill="#F4ECDD" stroke="#D8C8AE" stroke-width="3" mask="url(#ticketNotches)" />
  </g>

  <!-- Inner Double Border -->
  <rect x="44" y="44" width="512" height="1512" rx="12" fill="none" stroke="#B6834D" stroke-width="2" stroke-dasharray="8 4" opacity="0.65" />

  <!-- Top Admission Header -->
  <text x="64" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#9E325F">ADMIT ONE • CLASSIC STUDIO</text>
  <text x="536" y="92" text-anchor="end" font-family="monospace" font-size="14" font-weight="700" fill="#7A6554">NO. 2026-0411</text>
  <line x1="64" y1="110" x2="536" y2="110" stroke="#9E325F" stroke-width="1.5" opacity="0.45" />

  <!-- Photo Slot 1 -->
  <rect x="64" y="136" width="472" height="340" rx="10" fill="#E8DEC8" stroke="#B6834D" stroke-width="2" />
  <text x="300" y="314" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#8C735B">SLOT FOTO 01 • TAKE ONE</text>

  <!-- Photo Slot 2 -->
  <rect x="64" y="512" width="472" height="340" rx="10" fill="#E8DEC8" stroke="#B6834D" stroke-width="2" />
  <text x="300" y="690" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#8C735B">SLOT FOTO 02 • TAKE TWO</text>

  <!-- Photo Slot 3 -->
  <rect x="64" y="888" width="472" height="340" rx="10" fill="#E8DEC8" stroke="#B6834D" stroke-width="2" />
  <text x="300" y="1066" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#8C735B">SLOT FOTO 03 • ENCORE</text>

  <!-- Perforation Line -->
  <line x1="56" y1="1330" x2="544" y2="1330" stroke="#7A6554" stroke-width="2.5" stroke-dasharray="10 10" />

  <!-- Tear-Off Stub Footer -->
  <text x="64" y="1386" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#2A1F1D">MOMENTOS</text>
  <text x="64" y="1418" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#9E325F">VINTAGE CINEMA STUB • SOLO &amp; DUO</text>

  <!-- Barcode graphic -->
  <g transform="translate(64, 1450)" fill="#2A1F1D" opacity="0.88">
    <rect x="0" y="0" width="6" height="64" />
    <rect x="12" y="0" width="3" height="64" />
    <rect x="22" y="0" width="10" height="64" />
    <rect x="38" y="0" width="4" height="64" />
    <rect x="48" y="0" width="8" height="64" />
    <rect x="64" y="0" width="3" height="64" />
    <rect x="74" y="0" width="12" height="64" />
    <rect x="92" y="0" width="4" height="64" />
    <rect x="102" y="0" width="7" height="64" />
    <rect x="116" y="0" width="3" height="64" />
    <rect x="126" y="0" width="9" height="64" />
    <rect x="142" y="0" width="5" height="64" />
    <rect x="154" y="0" width="11" height="64" />
    <rect x="172" y="0" width="4" height="64" />
    <rect x="182" y="0" width="7" height="64" />
    <rect x="196" y="0" width="10" height="64" />
    <rect x="212" y="0" width="4" height="64" />
  </g>
  <text x="536" y="1496" text-anchor="end" font-family="monospace" font-size="16" font-weight="700" fill="#5D4B3E">NOV 14 '26 • 100% LOCAL</text>
</svg>
